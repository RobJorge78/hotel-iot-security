
name: Security API Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hotelsecurity_test
          POSTGRES_USER: hoteluser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hoteluser -d hotelsecurity_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: security-api

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: security-api/pom.xml

      - name: Run automated tests
        env:
          DB_PASSWORD: testpassword
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/hotelsecurity_test
        run: bash ./mvnw test
